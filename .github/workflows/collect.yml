name: Optional scheduled collection
on:
  workflow_dispatch:
# Enable only if Supabase Cron is disabled. GitHub scheduled runs may be delayed.
# schedule:
#   - cron: '23 */6 * * *'
permissions: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch bounded sync batch
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --max-time 65 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$TRACKER_URL/api/cron/sync"
